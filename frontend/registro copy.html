<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-In Córdoba | Gestión Hotelera</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Check-In <span>Córdoba</span></div>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="registro-huesped" class="form-container">
    <h2>Registro de Nuevo Huésped</h2>
    <form id="form-checkin">
        <div class="grupo">
            <label>Nombre Completo:</label>
            <input type="text" placeholder="Ej: Juan Pérez" required>
        </div>
        <div class="grupo">
            <label>DNI / Pasaporte:</label>
            <input type="number" placeholder="Sin puntos" required>
        </div>
        <div class="grupo">
            <label>Habitación:</label>
            <select>
                <option>Seleccionar...</option>
                <option>101 - Matrimonial</option>
                <option>102 - Individual</option>
                <option>201 - Suite Alberdi</option>
            </select>
        </div>
        <button type="submit" class="btn-ingresar">Confirmar Ingreso</button>
    </form>
</section>
        
            
    </main>
